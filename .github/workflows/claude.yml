name: Claude

# Assigning yusifaliyevpro to an issue starts an agent that fixes it and opens a pull request.
# Commenting "@claude …" on that issue or its pull request asks for more changes. Merging stays manual.
on:
  issues:
    types: [assigned]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  # One run per issue or pull request; a second request waits instead of racing the first.
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # The repo is public: only the owner can start a run, so nobody else spends the subscription.
    if: >-
      (github.event_name == 'issues' && github.event.assignee.login == 'yusifaliyevpro') ||
      (github.event_name == 'issue_comment' && github.event.comment.user.login == 'yusifaliyevpro' &&
        contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && github.event.comment.user.login == 'yusifaliyevpro' &&
        contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && github.event.review.user.login == 'yusifaliyevpro' &&
        contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.x

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          assignee_trigger: yusifaliyevpro
          # The Claude app's own account; the default id is GitHub Actions', which credits github-actions[bot].
          bot_id: "209825114"
          bot_name: claude[bot]
          base_branch: main
          branch_prefix: claude/
          track_progress: true
          additional_permissions: |
            actions: read
          claude_args: |
            --model claude-opus-5-5
            --max-turns 120
            --allowedTools "Edit,Write,Read,Glob,Grep,Bash(pnpm:*),Bash(git:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(gh run view:*)"
            --disallowedTools "Bash(git push --force:*),Bash(git push -f:*),Bash(gh pr merge:*),Bash(pnpm publish:*),Bash(pnpm build:*)"
            --append-system-prompt "You work on Tidra unattended. Read AGENTS.md and STYLE.md first and follow them. For a bug, write a failing test that reproduces it before fixing (test-first); for a feature, build it and then cover it with tests. Keep the change focused on this issue. Never change version in package.json or the README download links: a version change merged to main publishes a release. Never merge, never force-push, never add an AI co-author or attribution to commits or the PR. You cannot run the desktop app here (no display, no Rust toolchain), so verify with: pnpm fmt, then pnpm check typescript oxfmt oxlint vitest react-doctor; Windows CI on the pull request covers the Rust checks. Commit with a Conventional Commits message, push your branch, and open a pull request against main with gh pr create whose body says what changed and why, ends with 'Fixes #<issue number>', and lists anything you could not verify (UI you could not see). If the issue is unclear or too risky to change without the owner, comment a short question on the issue instead of guessing."
