[package]
name = "tidra"
# Not the app version: tauri.conf.json takes it from package.json, the only place to bump.
version = "0.0.0"
description = "Keep every project you maintain up to date from one desktop app."
license = "AGPL-3.0-or-later"
edition = "2024"
rust-version = "1.98"

[lib]
name = "tidra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-http = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "rt", "sync", "macros", "time"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
listeners = "0.6"
rusqlite = { version = "0.41", features = ["bundled"] }
which = "8"

[profile.dev]
incremental = true

[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
winreg = "0.56.0"
